# Wifi Info
  - platform: wifi_info
    ip_address:
      name: "${name} IP"
    ssid:
      name: "${name} SSID"
    mac_address:
      name: "${name} MAC"

# Master(1)
  - platform: jk_bms_ble  
    jk_bms_ble_id: bms0
