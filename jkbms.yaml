substitutions:
  name: jk-bms
  bms0: "${name}_1"
  bms1: "${name}_2"
#  bms2: "${name}_3"
  device_description: "Monitor and control a JK-BMS v11 via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  bms1_mac_address: AA:BB:CC:DD:EE:F1
  bms0_mac_address: AA:BB:CC:DD:EE:F2
#  bms2_mac_address: AA:BB:CC:DD:EE:F3
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  bms0_protocol_version: JK02_32S
  bms1_protocol_version: JK02_32S
#  bms2_protocol_version: JK02_32S

esphome:
  name: ${name}
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "syssi.esphome-jk-bms"
    version: 2.1.0

  on_boot:
    priority: -100
    then:
      - component.update: bms0_mac_text
      - component.update: bms1_mac_text
#      - component.update: bms2_mac_text
      - text_sensor.template.publish:
          id: esp_status
          state: "Normal"  

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: arduino

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:

  ssid: !secret wifi_ssid
  password: !secret wifi_password


web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password  
    
# Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "jk-bms"
#    password: "1234567890"

#captive_portal:

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - switch.turn_off: ble_client_switch1
#      - switch.turn_off: ble_client_switch2
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: ERROR
#  logs:
#    esp32_ble_tracker: WARN
#    esp32_ble_client: WARN
#    jk_bms_ble: WARN


api:
  encryption:
    key: "MICdddY7PT0y1C2dvvMohLgVt3MP0HPzBgC6HLiZQMI="

esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 1500ms
    window: 300ms

ble_client:

# Master(1)  
  - mac_address: ${bms0_mac_address}
    id: client0

# Slave_1(2)
  - mac_address: ${bms1_mac_address}
    id: client1

# Slave_2(3)
#  - mac_address: ${bms2_mac_address}
#    id: client2        

jk_bms_ble:

# Master(1)  
  - ble_client_id: client0
    protocol_version: ${bms0_protocol_version}
    throttle: 10s
    id: bms0

# Slave_1(2)
  - ble_client_id: client1
    protocol_version: ${bms1_protocol_version}
    throttle: 10s
    id: bms1

# Slave_2(3)
#  - ble_client_id: client2
#    protocol_version: ${bms2_protocol_version}
#    throttle: 5s
#    id: bms2        

light:
  - platform: monochromatic
    output: WIFI_LED
    id: status_led
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 2s
          update_interval: 2s
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
