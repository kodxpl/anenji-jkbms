sensor:

# Wolny RAM ESP32 (esp-idf)
  - platform: template
    name: "${name} Free RAM"
    lambda: "return (float)esp_get_free_heap_size() / 1024.0;"
    update_interval: 10s
    unit_of_measurement: "kB"
    accuracy_decimals: 1
    entity_category: diagnostic  

# Kontrola sygnału WIFI
  - platform: wifi_signal
    name: "WiFi signal strenght"
    update_interval: 10s       

# Sumaryczna moc (W)
  - platform: template
    name: "Total power"
    id: Laczna_moc
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(LFP_1_moc).state + id(LFP_2_moc).state; 

# Lambda dla 3 magazynów
#      return id(LFP_1_moc).state + id(LFP_2_moc).state + id(LFP_3_moc).state; 

# Sumaryczna moc oddana (W)
  - platform: template
    name: "Total discharging power"
    id: Laczna_moc_oddawana
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(LFP_1_oddanie).state + id(LFP_2_oddanie).state;

# Lambda dla 3 magazynów
#      return id(LFP_1_oddanie).state + id(LFP_2_oddanie).state + id(LFP_3_oddanie).state;      

# Sumaryczna moc przyjęta (W)
  - platform: template
    name: "Total Charging power"
    id: Laczna_moc_przyjmowana
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(LFP_1_przyjecie).state + id(LFP_2_przyjecie).state; 

# Lambda dla 3 magazynów
#      return id(LFP_1_przyjecie).state + id(LFP_2_przyjecie).state + id(LFP_3_przyjecie).state;

# Całkowita energia oddana przez cały system (kWh)
  - platform: integration
    name: "LFP discharging total"
    sensor: Laczna_moc_oddawana
    time_unit: h
    restore: true
    icon: mdi:counter
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh  

# Całkowita energia przyjęta przez cały system (kWh)
  - platform: integration
    name: "LFP charging total"
    sensor: Laczna_moc_przyjmowana
    time_unit: h
    restore: true
    icon: mdi:counter
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh  

# Energia oddana dzisiaj dla całego systemu
  - platform: total_daily_energy
    name: "LFP discharging today"
    restore: true
    icon: mdi:counter
    power_id: Laczna_moc_oddawana
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    device_class: energy 

# Energia przyjęta dzisiaj dla całego systemu
  - platform: total_daily_energy
    name: "LFP charging today"
    restore: true
    icon: mdi:counter
    power_id: Laczna_moc_przyjmowana
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh
    device_class: energy 

