text_sensor:

  - platform: template
    name: "Status"
    id: esp_status
    entity_category: diagnostic
    icon: mdi:information-outline
    update_interval: never

  # Stały MAC pierwszego BMS-a
  - platform: template
    name: "${bms0} BLE"
    id: bms0_mac_text
    entity_category: diagnostic
    icon: mdi:bluetooth
    lambda: |-
      return {"${bms0_mac_address}"};
    update_interval: never

#   Stały MAC drugiego BMS-a
  - platform: template
    name: "${bms1} BLE"
    id: bms1_mac_text
    entity_category: diagnostic
    icon: mdi:bluetooth
    lambda: |-
      return {"${bms1_mac_address}"};
    update_interval: never 

