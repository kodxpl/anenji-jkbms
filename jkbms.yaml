interval:
  - interval: 24h
    then:
      - logger.log: "BMS0 resistance update"
      - button.press: retrieve_resistance_bms0
      - delay: 2s
      - logger.log: "Aktualizacja rezystancji BMS1"
      - button.press: retrieve_resistance_bms1
      - delay: 2s
#      - logger.log: "Aktualizacja rezystancji BMS2"
#      - button.press: retrieve_resistance_bms2
  
# Niebieska Kontrolka  
  - interval: 5s
    then:
      - if:
          condition:
            not:
              wifi.connected: {}
          then:
            - light.turn_on:
                id: status_led
                effect: "Slow Pulse"
          else:
            - if:
                condition:
                  not:
                    api.connected: {}
                then:
                  - light.turn_on:
                      id: status_led
                      effect: "Fast Pulse"
                else:
                  - light.turn_on:
                      id: status_led
                      brightness: 100%
                      effect: none

time:
  - platform: homeassistant
    id: homeassistant_time          